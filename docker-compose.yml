services:
  postgres:
    image: postgres:17
    container_name: radio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: radio_management
      POSTGRES_USER: radio_user
      POSTGRES_PASSWORD: radio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: