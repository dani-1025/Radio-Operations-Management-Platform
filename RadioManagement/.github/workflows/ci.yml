
name: Java CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x RadioManagement/RadioManagement/mvnw

      - name: Run tests
        working-directory: RadioManagement/RadioManagement
        run: ./mvnw -B "-Duser.timezone=UTC" test
